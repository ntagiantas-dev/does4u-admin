    has_rss: false
    google_news_fallback: true

  cohere:
    display_name: Cohere
    domains:
      - cohere.com
    news_page: https://cohere.com/blog
    feeds: []
    has_rss: false
    google_news_fallback: true

  microsoft:
    display_name: Microsoft AI
