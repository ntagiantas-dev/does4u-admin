# ============================================
# DOES4U — ΜΗΤΡΩΟ ΕΠΙΣΗΜΩΝ ΠΗΓΩΝ
# ============================================
# Μόνο αυτά τα domains επιτρέπονται για δημιουργία άρθρων.
# Ο CEO μπορεί να προσθέσει/αφαιρέσει εταιρίες.
#
# Πεδία:
#   display_name:          Ανθρώπινο όνομα
#   domains:               Επίσημα domains (πρώτο = primary για restricted)
#   news_page:             Σελίδα νέων (για ανθρώπους)
#   feeds:                 RSS feeds (αν υπάρχουν)
#   has_rss:               Αν έχει δικό του RSS
#   google_news_fallback:  Αν true, χρησιμοποιείται Google News RSS όταν
#                          has_rss=false (fallback για εταιρίες χωρίς RSS)
# ============================================

companies:

  openai:
    display_name: OpenAI
    domains:
      - openai.com
      - platform.openai.com
    news_page: https://openai.com/news/
    feeds:
      - https://openai.com/news/rss.xml
    has_rss: true
    google_news_fallback: false

  anthropic:
    display_name: Anthropic
    domains:
      - anthropic.com
      - docs.anthropic.com
    news_page: https://www.anthropic.com/news
    feeds: []
    has_rss: false
    google_news_fallback: true

  google:
    display_name: Google / DeepMind
    domains:
      - blog.google
      - deepmind.google
    news_page: https://blog.google/technology/ai/
    feeds:
      - https://blog.google/technology/ai/rss/
    has_rss: true
    google_news_fallback: false

